{% extends "shadowrun_char/base_generator.html" %}
{% load crispy_forms_tags %}
{% block title %}Create Character - Step 1{% endblock %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="generator-card">
                <h3 class="text-center mb-4">
                    <i class="bi bi-person-plus-fill"></i> Create New Character
                </h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-arrow-right"></i> Set Attributes
                        </button>
                        <a href="{% url 'shadowrun_char:home' %}"
                           class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
