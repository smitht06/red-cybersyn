{% extends '_base.html' %}
{% load crispy_forms_tags %}

{% block title %}Add Quality to {{ character.name }}{% endblock title %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="mb-4">Add Quality to {{ character.name }}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Add Quality</button>
        <a href="{% url 'characters:detail' character.pk %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock content %}
